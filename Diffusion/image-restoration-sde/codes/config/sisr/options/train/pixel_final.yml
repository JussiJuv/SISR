#### general settings
name: refusion
use_tb_logger: true
model: denoising # denoising, latent_denoising
distortion: sr
gpu_ids: [0]

space_mode: pixel # latent, pixel

network_G:
  preset: pixel_default # latent_default, pixel_default, latent_big, pixel_big

latent_config:
  path: '/projappl/project_2012243/image-restoration/Diffusion/image-restoration-sde/latent_model/latent_bokeh.pth'
  stats_path: '/projappl/project_2012243/image-restoration/Diffusion/image-restoration-sde/latent_model/latent_stats.pt'

sde:
  max_sigma: 50
  T: 100
  schedule: cosine # linear, cosine
  eps: 0.005

degradation: # for some synthetic dataset that only have GTs
  # for denoising
  sigma: 25
  noise_type: G # Gaussian noise: G

  # for super-resolution
  scale: 4

#### datasets
datasets:
  train:
    optimizer: AdamW # Adam, AdamW, Lion
    name: Train_Dataset
    mode: LQGT
    dataroot_GT: C:\koulua\Dippa\dataset\DIV2K\DIV2K_train_HR
    dataroot_LQ: C:\koulua\Dippa\dataset\DIV2K\DIV2K_train_LR_bicubic\X4

    use_shuffle: true
    n_workers: 4 # per GPU
    batch_size: 32
    GT_size: 256
    LR_size: 64
    use_flip: true
    use_rot: true
    color: RGB
  val:
    name: Val_Dataset
    mode: LQGT
    dataroot_GT: C:\koulua\Dippa\dataset\DIV2K\DIV2K_valid_HR
    dataroot_LQ: C:\koulua\Dippa\dataset\DIV2K\DIV2K_valid_LR_bicubic\X4

#### network structures
# network_L not used in pixel space
network_L:
  which_model: UNet
  setting:
    in_ch: 3
    out_ch: 3
    ch: 64
    ch_mult: [1, 2, 4]
    embed_dim: 4

#### path
path:
  experiments_root: '/scratch/project_2012243/image-restoration/diffusion/output1'
  log: '/scratch/project_2012243/image-restoration/diffusion/output1/logs'
  models: '/scratch/project_2012243/image-restoration/diffusion/output1/models'
  training_state: '/scratch/project_2012243/image-restoration/diffusion/output1/training_state'
  val_images: '/scratch/project_2012243/image-restoration/diffusion/output1/val_images'
  pretrain_model_G: ~
  pretrain_model_L: '/projappl/project_2012243/image-restoration/Diffusion/image-restoration-sde/latent_model/latent_bokeh.pth'
  strict_load: true
  resume_state: ~

#### training settings: learning rate scheme, loss
train:
  optimizer: AdamW # Adam, AdamW, Lion
  lr_G: !!float 2e-4
  lr_scheme: TrueCosineAnnealingLR
  beta1: 0.9
  beta2: 0.99
  niter: 25000
  warmup_iter: -1 # no warm up
  lr_steps: [200000, 400000, 600000]
  lr_gamma: 0.5
  eta_min: !!float 1e-7
  use_amp:: true
  dataset_ratio: 1

  # criterion
  is_weighted: False
  loss_type: l1
  weight: 1.0

  manual_seed: 0
  val_freq: 99999999999
  val_max_images: 1

#### logger
logger:
  print_freq: 25
  save_checkpoint_freq: 2500