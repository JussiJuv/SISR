  log: C:\koulua\Dippa_koodit_test\Diffusion\image-restoration-sde\experiments\results
  validation_dir: C:\koulua\Dippa_koodit_test\Diffusion\image-restoration-sde\experiments\results\val
  pretrain_model_G: C:\koulua\Dippa_koodit_test\Diffusion\image-restoration-sde\experiments\models\latest_EMA.pth
  pretrain_model_L: C:\koulua\Dippa_koodit_test\Diffusion\image-restoration-sde\latent_model/latent_bokeh.pth
